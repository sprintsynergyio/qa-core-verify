# Prepared for a later public release. It does not run on pull requests.
# No sibling repository (qa-core-heal, qa-core-flaky, qa-core-prcheck) has an npm publish workflow.
# Those repositories only have CI. This file is not copied from them.
# npm publish --provenance refuses a private repository, and it can write a public
# Sigstore entry before that refusal. The visibility step exits before publish.
name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish To npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Tag Matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - name: Refuse Provenance From A Private Repository
        run: |
          if [ "${{ github.event.repository.visibility }}" != "public" ]; then
            echo "npm publish --provenance needs a public repository. Make the repository public before pushing a tag."
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
