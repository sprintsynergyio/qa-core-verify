name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck And Test (Node ${{ matrix.node }})
    # ubuntu-latest is Ubuntu 26.04. Playwright 1.60.0 refuses Chromium there.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.60.0-${{ runner.os }}

      - name: Install Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Check For Em Dashes
        run: |
          if grep -rnP '\x{2014}' . --exclude-dir=node_modules --exclude-dir=.git; then
            echo "Found an em dash. Remove it."
            exit 1
          fi

  live-demo:
    name: Live Demo
    if: github.event_name == 'workflow_dispatch'
    # ubuntu-latest is Ubuntu 26.04. Playwright 1.60.0 refuses Chromium there.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.60.0-${{ runner.os }}

      - name: Install Chromium
        timeout-minutes: 12
        run: npx playwright install --with-deps chromium

      - name: Run Good Tests
        run: npm run demo:saucedemo -- tests/good
